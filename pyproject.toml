[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "feces"
version = "0.1.0"
description = "FDTD/EME Cascaded Electromagnetic Solver for photonic MMI devices"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
eme = ["meow-sim"]
fdtd = ["meep"]
all = ["meow-sim", "meep"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["feces*"]

[tool.pytest.ini_options]
markers = [
    "slow: golden-value integration tests that run a real (reduced-res) meep/meow simulation",
]
