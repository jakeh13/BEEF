[build-system]
# >=77 for PEP 639 license expression support (license = "Apache-2.0" as an
# SPDX string plus license-files). Older setuptools rejects those two keys.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beef"
dynamic = ["version"]        # single source of truth: beef/__init__.py
description = "Bridged Engine for EME and FDTD - hybrid FDTD/EME cascades for integrated photonic devices"
readme = "README.md"
requires-python = ">=3.11"   # jax (via meow -> sax) no longer supports 3.10
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Jacob M. Hiesener" },
    { name = "Stephen E. Ralph", email = "stephen.ralph@ece.gatech.edu" },
]
keywords = [
    "photonics",
    "integrated-photonics",
    "electromagnetics",
    "simulation",
    "fdtd",
    "eme",
    "meep",
]
# No "License :: OSI Approved :: ..." classifier on purpose: PEP 639 forbids
# pairing a license expression with a license classifier, and setuptools>=77
# errors if both are present.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
]

[project.urls]
Repository = "https://github.com/jakeh13/BEEF"
Changelog = "https://github.com/jakeh13/BEEF/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# meow is pinned to a git commit, not a release: BEEF's default
# mode_solver="meep" calls meow.compute_modes_meep, merged upstream
# 2026-09-16 and absent from meow-sim 0.15.0 (2026-03-15). A plain
# "meow-sim" requirement resolves to that release and fails on import.
# NOTE: a PEP 508 direct reference cannot be uploaded to PyPI. If beef is
# ever published there, this has to become a plain version floor against
# whatever meow release first carries compute_modes_meep.
eme = ["meow-sim @ git+https://github.com/gdsfactory/meow.git@b6ba461"]
gds = ["gdstk"]
all = ["meow-sim @ git+https://github.com/gdsfactory/meow.git@b6ba461", "gdstk"]
dev = ["pytest"]

# There is deliberately no [fdtd] extra. PyPI's "meep" package is an unrelated
# project (a task runner); `pip install meep` installs it silently and leaves
# `import meep` broken. The real MIT electromagnetics package ships only as
# conda-forge `pymeep` and cannot be expressed as a pip dependency at all.
# See the Install section of README.md.

# Read the version from beef.__version__ so it is declared in exactly one
# place. setuptools parses the assignment statically; the package is not
# imported at build time.
[tool.setuptools.dynamic]
version = { attr = "beef.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["beef*"]

# PEP 561 marker. Without this entry the file exists in the tree but is left
# out of the wheel, and type checkers go on treating beef as untyped.
[tool.setuptools.package-data]
beef = ["py.typed"]

[tool.pytest.ini_options]
markers = [
    "slow: golden-value integration tests that run a real (reduced-res) meep/meow simulation",
]
