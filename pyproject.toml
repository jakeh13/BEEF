[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beef"
version = "0.1.0"
description = "BEEF (Bridged Engine for EME and FDTD) for photonic MMI devices"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
eme = ["meow-sim"]
fdtd = ["meep"]
gds = ["gdstk"]
all = ["meow-sim", "meep", "gdstk"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["beef*"]

[tool.pytest.ini_options]
markers = [
    "slow: golden-value integration tests that run a real (reduced-res) meep/meow simulation",
]
