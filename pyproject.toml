[build-system]
# >=77 for PEP 639 license expression support (license = "Apache-2.0" as an
# SPDX string plus license-files). Older setuptools rejects those two keys.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beef"
dynamic = ["version"]        # single source of truth: beef/__init__.py
description = "Bridged Engine for EME and FDTD - hybrid FDTD/EME cascades for integrated photonic devices"
readme = "README.md"
requires-python = ">=3.11"   # jax (via meow -> sax) no longer supports 3.10
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Jacob M. Hiesener" },
    { name = "Stephen E. Ralph", email = "stephen.ralph@ece.gatech.edu" },
]
keywords = [
    "photonics",
    "integrated-photonics",
    "electromagnetics",
    "simulation",
    "fdtd",
    "eme",
    "meep",
]
# No "License :: OSI Approved :: ..." classifier on purpose: PEP 639 forbids
# pairing a license expression with a license classifier, and setuptools>=77
# errors if both are present.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
]

[project.urls]
Repository = "https://github.com/jakeh13/BEEF"
Changelog = "https://github.com/jakeh13/BEEF/blob/main/CHANGELOG.md"

[project.optional-dependencies]
eme = ["meow-sim"]
fdtd = ["meep"]
gds = ["gdstk"]
all = ["meow-sim", "meep", "gdstk"]
dev = ["pytest"]

# Read the version from beef.__version__ so it is declared in exactly one
# place. setuptools parses the assignment statically; the package is not
# imported at build time.
[tool.setuptools.dynamic]
version = { attr = "beef.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["beef*"]

# PEP 561 marker. Without this entry the file exists in the tree but is left
# out of the wheel, and type checkers go on treating beef as untyped.
[tool.setuptools.package-data]
beef = ["py.typed"]

[tool.pytest.ini_options]
markers = [
    "slow: golden-value integration tests that run a real (reduced-res) meep/meow simulation",
]
