name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 dropped 2026-09-22. meow pulls in jax via sax, jax no longer
        # ships for 3.10, so pip backtracks to meow-sim 0.12.0 + klujax
        # 0.4.3 and lands on a sax/klujax pair that cannot import:
        # "module 'klujax' has no attribute 'coo_mul_vec'". 3.11 and 3.12
        # both pass 759/759 on the same commit.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install beef + test deps
        # [eme] and [gds] too, not just [dev]. The fast suite exercises
        # EMESolver and the GDS geometry paths, both of which import their
        # backend at call time (`import meow as mw`, `import gdstk`), so with
        # only [dev] every such test fails on ModuleNotFoundError rather than
        # on anything real -- 2 tests since 2026-08-29, 9 by 2026-09-21.
        # [fdtd] is deliberately excluded: meep is not pip-installable (see
        # README), and the tests that need it are marked slow and deselected.
        run: pip install -e ".[dev,eme,gds]"

      - name: Run fast test suite
        run: pytest tests/ -v -m "not slow"
